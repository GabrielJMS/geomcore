site_name: geomcore
site_url: https://geomcore.github.io/geomcore/
repo_url: https://github.com/geomcore/geomcore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.tabs.link

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables

extra_css:
  - stylesheets/figures.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js
  - javascripts/mathjax.js

nav:
  - Home: index.md
  - Geometry:
    - Elementary curves & surfaces: geometry/elementary.md
  - NURBS:
    - Overview: nurbs/index.md
    - Curves: nurbs/curves.md
    - Surfaces: nurbs/surfaces.md
    - Editing & fitting: nurbs/editing-fitting.md
  - Guides:
    - Projection & containment: guides/projection.md
    - Intersection: guides/intersection.md
    - Discretization: guides/discretization.md
    - Curve on surface: guides/parametrization.md
  - Viewer: viewer.md
  - Python: python.md
  - Roadmap: roadmap.md

exclude_docs: |
  superpowers/*
  agents/*
