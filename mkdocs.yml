site_name: geomcore
site_url: https://gabrieljms.github.io/geomcore/
repo_url: https://github.com/GabrielJMS/geomcore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.tabs.link

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - NURBS: nurbs.md
  - Viewer: viewer.md
  - Python: python.md
  - Roadmap: roadmap.md

exclude_docs: |
  superpowers/*
  agents/*
