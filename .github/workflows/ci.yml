name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --doc
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p geomcore-py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install maturin pytest mypy
      - run: maturin build --manifest-path geomcore-py/Cargo.toml --out dist
      - run: pip install --no-index --find-links dist geomcore
      - run: pytest geomcore-py/tests
      - run: python -m mypy.stubtest geomcore --allowlist geomcore-py/stubtest-allowlist.txt
